[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-serve"
version = "0.1.0"
description = "MLX-based multimodal AI server with OpenAI-compatible API (LLM, Vision, Audio, Image Generation)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "mlx-serve contributors" }
]
keywords = ["mlx", "llm", "embeddings", "reranking", "vision", "audio", "tts", "stt", "image-generation", "openai", "api", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.6.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",

    # CLI & Config
    "typer>=0.27.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",

    # MLX Core
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "mlx-embeddings>=0.1.0",

    # MLX Multimodal
    "mlx-vlm==0.7.10",
    "mlx-audio>=0.6.2",
    "mflux>=0.24.0",

    # Utils
    "huggingface-hub>=1.33.0,<2.0",
    "transformers>=5.21.0",
    "cachetools>=7.2.6",
    "prometheus-client>=0.26.0",
    "Pillow>=13.0.0",
    "soundfile>=0.14.0",
    "python-multipart>=0.0.32",
    "setproctitle>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
# Required for VLM model conversion (Qwen-VL, etc.)
vlm-convert = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
mlx-serve = "mlx_serve.cli:app"

[project.urls]
Homepage = "https://github.com/mlx-serve/mlx-serve"
Repository = "https://github.com/mlx-serve/mlx-serve"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_serve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
